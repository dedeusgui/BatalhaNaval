<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Batalha Naval</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 40px;
    }
    table {
      border-collapse: collapse;
      margin: 0 auto;
      width: 300px;
      height: 300px;
      text-align: center;
    }
    td {
      border: 1px solid black;
      padding: 10px;
      cursor: pointer;
    }
    input {
      margin: 5px;
    }
  </style>
</head>
<body>

  <h1>Batalha Naval</h1>

  <div>
    <label for="x">Linha (0-4):</label>
    <input type="number" id="x" min="0" max="4">
    <label for="y">Coluna (0-4):</label>
    <input type="number" id="y" min="0" max="4">
    <button onclick="jogarRodada()">Atirar</button>
  </div>

  <table id="tabela">
    <tbody></tbody>
  </table>

  <script src="batalhanaval.js"></script>
</body>
</html>
